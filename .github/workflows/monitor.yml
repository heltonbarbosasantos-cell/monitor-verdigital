name: Monitor de Sites

on:
  # Reserva: o agendador do GitHub atrasa por horas em repositórios públicos.
  # A corrente abaixo (cada execução dispara a próxima) é quem garante os 15 min.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Só uma execução por vez; se outra chegar, ela espera (a mais antiga da fila é descartada).
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Marcar horario de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Rodar monitor
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
          WHATSAPP_NUMERO: ${{ secrets.WHATSAPP_NUMERO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python monitor.py

      - name: Publicar status.json no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: true

      # Roda sempre (mesmo se o monitor falhar) para a corrente não quebrar.
      - name: Esperar e disparar a proxima verificacao
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alvo=$(( INICIO + 900 ))
          agora=$(date +%s)
          if [ "$alvo" -gt "$agora" ]; then
            sleep $(( alvo - agora ))
          fi
          gh workflow run monitor.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
